<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 2</title>
</head>
<body>
    <script>
        let n = Number(prompt("Введіть число:"));
        for (let i = 2; i <= n; i++) {
            if (i % 2 === 0) {
                console.log(i);
            }
        }
    </script>
</body>
