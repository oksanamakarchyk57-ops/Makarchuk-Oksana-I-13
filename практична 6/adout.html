<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Async Space UI with Moving Stars</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; }

body {
    font-family: "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #020617;
    overflow: hidden;
    color: #e2e8f0;
}

#stars {
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: radial-gradient(circle at 50% 50%, #2d3761, #000);
    z-index:0;
}

.app {
    position: relative;
    z-index:1;
    width: 90%;
    max-width: 700px;
}

.card {
    background: rgba(11, 29, 59, 0.75);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 25px;
    border: 1px solid rgba(59,130,246,0.4);
    box-shadow:
        0 0 15px rgba(21, 104, 238, 0.4),
        0 0 40px rgba(159, 160, 211, 0.3);
}

h1 {
    text-align: center;
    margin-bottom: 20px;
    text-shadow:
        0 0 8px rgba(59,130,246,0.8),
        0 0 15px rgba(47, 48, 114, 0.6);
}

button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: #1e4a92;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
}
button:hover {
    background: #0b2e78;
    box-shadow: 0 0 15px rgba(62, 88, 129, 0.9), 0 0 30px rgba(99,102,241,0.6);
}

#log {
    margin-top: 20px;
    background: rgba(2,6,23,0.8);
    border-radius: 12px;
    padding: 15px;
    height: 300px;
    overflow-y: auto;
    font-family: monospace;
}

.log-item { margin:6px 0; padding:6px; border-radius:6px; }
.success { background: rgba(34,197,94,0.2); box-shadow: 0 0 8px rgba(34,197,94,0.5);}
.parallel { background: rgba(59,130,246,0.2); box-shadow: 0 0 8px rgba(59,130,246,0.5);}
.sequential { background: rgba(168,85,247,0.2); box-shadow:0 0 8px rgba(168,85,247,0.5);}
.done { background: rgba(16,185,129,0.2); box-shadow:0 0 10px rgba(16,185,129,0.6);}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="app">
    <div class="card">
        <h1>Async Space Processor</h1>
        <button onclick="processData()">Запустити</button>
        <div id="log"></div>
    </div>
</div>

<script>
function log(message, type="") {
    const div = document.createElement("div");
    div.className = "log-item " + type;
    div.textContent = message;
    document.getElementById("log").appendChild(div);
    div.scrollIntoView({ behavior: "smooth" });
}

function fetchData(id) {
    return new Promise(resolve => {
        const delay = Math.floor(Math.random() * 2000) + 1000;
        setTimeout(() => { resolve(`ID ${id} → ${delay} мс`); }, delay);
    });
}

async function processData() {
    document.getElementById("log").innerHTML = "";
    log("🔵 Паралельні запити...", "parallel");

    const parallel = await Promise.all([fetchData(1), fetchData(2), fetchData(3)]);
    parallel.forEach(r => log("✅ " + r, "success"));

    log("🟣 Послідовні запити...", "sequential");

    const requests = [fetchData(4), fetchData(5), fetchData(6)];
    for await (const res of requests) { log("⏳ " + res, "sequential"); }

    log("🎉 Завершено!", "done");
}

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const stars = [];
for(let i=0; i<200; i++) {
    stars.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*1.2+0.3,
        speed: Math.random()*0.5+0.2
    });
}

function animateStars(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "white";
    stars.forEach(s=>{
        s.y -= s.speed;
        if(s.y<0) s.y=canvas.height;
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    });
    requestAnimationFrame(animateStars);
}

animateStars();

window.addEventListener('resize', ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
