<!DOCTYPE html>
<html lang="uk">
<meta charset="UTF-8" >
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Профіль користувача</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #e8f0fe;
    margin: 20px;
  }
  .profile, .posts {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 20px;
  }
  h2 {
    margin-top: 0;
    color: #34495e;
  }
  .post {
    border-top: 1px solid #ccc;
    padding-top: 10px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<h1>Профіль користувача</h1>

<div class="profile" id="profile"></div>
<h2>Його пости</h2>
<div class="posts" id="user-posts"></div>

<script>
async function завантажитиПрофільІПости() {
  const profileDiv = document.getElementById('profile');
  const postsDiv = document.getElementById('user-posts');

  try {
    // Завантажуємо дані користувача
    const користувачResponse = await fetch('https://jsonplaceholder.typicode.com/users/1');
    if (!користувачResponse.ok) throw new Error('Помилка при завантаженні даних користувача');
    const користувач = await користувачResponse.json();

    // Виведення даних користувача
    profileDiv.innerHTML = `
      <p><strong>Ім'я:</strong> ${користувач.name}</p>
      <p><strong>Email:</strong> ${користувач.email}</p>
      <p><strong>Місто:</strong> ${користувач.address.city}</p>
    `;

    // Завантажуємо пости користувача
    const постиResponse = await fetch(`https://jsonplaceholder.typicode.com/posts?userId=1`);
    if (!постиResponse.ok) throw new Error('Помилка при завантаженні постів користувача');
    const пости = await постиResponse.json();

    // Виведення постів
    пости.forEach(post => {
      const postDiv = document.createElement('div');
      postDiv.className = 'post';

      postDiv.innerHTML = `
        <h3>${post.title}</h3>
        <p>${post.body}</p>
      `;
      postsDiv.appendChild(postDiv);
    });
  } catch (error) {
    profileDiv.innerHTML = '<p class="error">Сталася помилка при завантаженні даних.</p>';
  }
}

завантажитиПрофільІПости();
</script>

</body>
</html>
